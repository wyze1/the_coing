name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GifWallpaper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GifWallpaper
          path: GifWallpaper.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GIF Wallpaper (latest build)
          body: Download GifWallpaper.apk on your phone and open it to install.
          prerelease: false
          make_latest: true
          files: GifWallpaper.apk
