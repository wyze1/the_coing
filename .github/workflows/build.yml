name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GifWallpaper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: GifWallpaper.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: >
          dotnet publish windows/GifWallpaper/GifWallpaper.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/GifWallpaper.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GIF Wallpaper (latest build)
          body: |
            **Phone (Android):** download GifWallpaper.apk on your phone and open it to install.
            **Windows 11:** download GifWallpaper.exe and run it. It lives in the system tray (bottom-right, near the clock).
          make_latest: true
          files: |
            GifWallpaper.apk
            GifWallpaper.exe
